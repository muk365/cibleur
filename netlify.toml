[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/search.php"
  to = "/.netlify/functions/search"
  status = 200
  force = true

[[redirects]]
  from = "/api/communes.php"
  to = "/.netlify/functions/communes"
  status = 200
  force = true

[[redirects]]
  from = "/api/settings.php"
  to = "/.netlify/functions/settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify_site.php"
  to = "/.netlify/functions/verify_site"
  status = 200
  force = true

[[redirects]]
  from = "/data/*"
  to = "/"
  status = 404
  force = true
